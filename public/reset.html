<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password | Secondhand Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<nav class="nav" aria-label="Main">
  <div class="nav-in">
    <a class="brand" href="index.html"><span class="mark" aria-hidden="true"></span>Secondhand Atlas</a>
    <div class="links">
      <a href="index.html#how">How it works</a>
      <a href="index.html#explore">Explore</a>
      <a href="index.html#stories">Stories</a>
      <a href="index.html#about">About</a>
    </div>
    <a class="secondary" href="login.html">Log in</a>
  </div>
</nav>

<main class="authwrap">
  <section class="intro">
    <h1>Choose a new password</h1>
    <p class="lead">Pick something you have not used on other sites. After saving, you can log in right away.</p>
  </section>

  <section class="tag" aria-labelledby="title">
    <h2 id="title">New password</h2>
    <p class="sub">At least 8 characters.</p>

    <form id="form" novalidate>
      <label for="password">New password</label>
      <div class="pw">
        <input id="password" type="password" autocomplete="new-password" required>
        <button type="button" class="show" aria-pressed="false">Show</button>
      </div>

      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" autocomplete="new-password" required>

      <p class="err" id="err" role="alert"></p>
      <button class="primary wide" id="submit" type="submit">Save new password</button>
    </form>

    <p class="alt" id="done" role="status" hidden></p>
    <p class="alt" id="more"><a href="forgot.html">Ask for a new link</a></p>
  </section>
</main>

<footer><div class="in">&copy; 2026 Secondhand Atlas. Cebu City, Philippines.</div></footer>

<script src="auth.js"></script>
<script>
  const token = new URLSearchParams(location.search).get('token') || '';
  const form = document.getElementById('form');
  const err = document.getElementById('err');
  const btn = document.getElementById('submit');
  const done = document.getElementById('done');
  const more = document.getElementById('more');

  document.querySelectorAll('.show').forEach(b => {
    b.addEventListener('click', () => {
      const input = b.parentElement.querySelector('input');
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      b.textContent = showing ? 'Show' : 'Hide';
      b.setAttribute('aria-pressed', String(!showing));
    });
  });

  if (!token){
    form.hidden = true;
    err.textContent = 'This link is missing its code. Open the link from your email again, or ask for a new one.';
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = '';
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password.length < 8){ err.textContent = 'Use a password with at least 8 characters.'; return; }
    if (password !== confirm){ err.textContent = 'The two passwords do not match.'; return; }

    btn.disabled = true; btn.textContent = 'Saving...';
    try{
      await Auth.call('POST', '/api/reset-password', {token, password});
      form.hidden = true;
      more.hidden = true;
      done.hidden = false;
      done.innerHTML = 'Your password was changed. <a href="login.html">Log in</a>';
    }catch(ex){
      err.textContent = ex.message || 'This link is invalid or has expired. Ask for a new one.';
      btn.disabled = false; btn.textContent = 'Save new password';
    }
  });
</script>
</body>
</html>
